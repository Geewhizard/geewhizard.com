<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>geewhizard.com</title>

    <link rel="icon" type="image/png" href="whizardpfp.png">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Comic Sans MS", "Comic Sans", cursive;
            background-image: url("background.png");
            background-repeat: repeat;
            background-size: 500px;
            color: white;
            overflow-x: hidden;
        }

        h1 {
            text-align: center;
            margin-top: 25px;
            font-size: 50px;
            text-shadow: 3px 3px 0 black;
        }

        /* =========================
           LOGIN
        ========================= */

        #loginButton {
            position: fixed;
            top: 15px;
            left: 15px;
            z-index: 1000;

            padding: 10px 18px;
            border-radius: 20px;
            border: 2px solid white;

            background: #222;
            color: white;

            font-family: inherit;
            font-size: 16px;
            cursor: pointer;
        }

        #loginButton:hover {
            background: #444;
        }

        #loginBox,
        #pfpBox {
            position: fixed;
            top: 65px;
            left: 15px;
            z-index: 1000;

            width: 280px;
            padding: 20px;

            background: rgba(20, 20, 20, 0.97);
            border: 2px solid white;
            border-radius: 15px;

            box-shadow: 0 5px 25px black;
        }

        #loginBox input {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;

            border-radius: 8px;
            border: 1px solid #aaa;

            font-family: inherit;
        }

        #loginBox button,
        #pfpBox button {
            padding: 8px 12px;
            margin: 3px;

            border: none;
            border-radius: 8px;

            background: #555;
            color: white;

            font-family: inherit;
            cursor: pointer;
        }

        #loginBox button:hover,
        #pfpBox button:hover {
            background: #777;
        }

        #loginMessage {
            margin-top: 10px;
            font-size: 14px;
        }

        /* =========================
           USER DISPLAY
        ========================= */

        #userDisplay {
            position: fixed;
            top: 15px;
            left: 15px;
            z-index: 999;

            display: flex;
            align-items: center;
            gap: 8px;

            padding: 6px 10px;

            background: rgba(0, 0, 0, 0.85);
            border: 2px solid white;
            border-radius: 25px;

            box-shadow: 0 3px 15px black;
        }

        #userPfp {
            width: 40px;
            height: 40px;

            border-radius: 50%;
            object-fit: cover;

            border: 2px solid white;
        }

        #userInfo {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        #usernameDisplay {
            font-size: 14px;
        }

        #userDisplay button {
            border: none;
            border-radius: 7px;

            padding: 4px 7px;

            background: #444;
            color: white;

            font-family: inherit;
            cursor: pointer;
        }

        #userDisplay button:hover {
            background: #666;
        }

        /* =========================
           PFP UPLOAD
        ========================= */

        #pfpBox {
            display: none;
        }

        #pfpBox input {
            width: 100%;
            margin-bottom: 10px;
        }

        /* =========================
           WHIZARD MENU
        ========================= */

        .whiz-menu {
            display: block;
            max-width: 300px;
            width: 70%;
            height: auto;

            margin: 20px auto;
        }

        /* =========================
           POSTS
        ========================= */

        #posts {
            width: min(800px, 94%);
            margin: 30px auto;
        }

        .post {
            background: rgba(0, 0, 0, 0.88);

            border: 2px solid white;
            border-radius: 18px;

            padding: 18px;
            margin-bottom: 25px;

            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.7);
        }

        /* Main post author */

        .post-author {
            display: flex;
            align-items: center;
            gap: 10px;

            margin-bottom: 12px;
        }

        .post-author-pfp {
            width: 48px;
            height: 48px;

            border-radius: 50%;
            object-fit: cover;

            border: 2px solid white;
        }

        .main-author-name {
            color: #2588ff;
            font-size: 19px;
            font-weight: bold;

            text-shadow: 1px 1px 2px black;
        }

        .post-date {
            display: block;
            font-size: 12px;
            color: #aaa;
        }

        .post-content {
            font-size: 20px;
            white-space: pre-wrap;
            word-wrap: break-word;

            margin: 15px 0;
        }

        /* =========================
           VOTING
        ========================= */

        .vote-buttons {
            display: flex;
            gap: 8px;

            margin-bottom: 15px;
        }

        .vote-buttons button {
            padding: 7px 12px;

            border: none;
            border-radius: 10px;

            background: #333;
            color: white;

            font-family: inherit;
            cursor: pointer;
        }

        .vote-buttons button:hover {
            background: #555;
        }

        /* =========================
           REPLIES
        ========================= */

        .replies {
            margin-top: 15px;
            padding-top: 12px;

            border-top: 1px solid #555;
        }

        .replies-title {
            font-size: 17px;
            margin-bottom: 10px;
        }

        .reply {
            display: flex;
            gap: 9px;

            margin: 10px 0;
            padding: 9px;

            background: rgba(255, 255, 255, 0.08);
            border-radius: 12px;
        }

        .reply-pfp {
            width: 34px;
            height: 34px;

            border-radius: 50%;
            object-fit: cover;

            border: 1px solid white;

            flex-shrink: 0;
        }

        .reply-body {
            min-width: 0;
            flex: 1;
        }

        .reply-header {
            display: flex;
            align-items: center;
            gap: 7px;

            margin-bottom: 3px;
        }

        .reply-username {
            font-weight: bold;
            color: #58a6ff;
        }

        .reply-date {
            color: #888;
            font-size: 11px;
        }

        .reply-content {
            white-space: pre-wrap;
            word-wrap: break-word;

            font-size: 15px;
        }

        .delete-reply {
            margin-left: auto;

            padding: 3px 7px;

            border: none;
            border-radius: 6px;

            background: #8b0000;
            color: white;

            font-family: inherit;
            cursor: pointer;
        }

        .delete-reply:hover {
            background: #c00000;
        }

        /* =========================
           REPLY FORM
        ========================= */

        .reply-form {
            display: flex;
            gap: 7px;

            margin-top: 12px;
        }

        .reply-input {
            flex: 1;

            min-width: 0;

            padding: 9px 12px;

            border: 1px solid #777;
            border-radius: 10px;

            background: #111;
            color: white;

            font-family: inherit;
            outline: none;
        }

        .reply-input:focus {
            border-color: #2588ff;
        }

        .reply-submit {
            padding: 8px 13px;

            border: none;
            border-radius: 10px;

            background: #2588ff;
            color: white;

            font-family: inherit;
            cursor: pointer;
        }

        .reply-submit:hover {
            background: #1475e8;
        }

        /* =========================
           GIF BUTTON
        ========================= */

        .gif-button {
            display: block;

            width: 180px;
            height: 120px;

            margin: 40px auto;

            overflow: hidden;

            border-radius: 50%;

            transition: 0.3s ease;

            text-decoration: none;
        }

        .gif-button img {
            width: 100%;
            height: 100%;

            object-fit: cover;
        }

        .gif-button .animated {
            display: none;
        }

        .gif-button:hover {
            width: 230px;
            height: 150px;
        }

        .gif-button:hover .still {
            display: none;
        }

        .gif-button:hover .animated {
            display: block;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            h1 {
                font-size: 35px;
                margin-top: 80px;
            }

            #userDisplay {
                max-width: calc(100% - 30px);
            }

            .post-content {
                font-size: 17px;
            }

            .reply-form {
                flex-direction: column;
            }

            .reply-submit {
                width: 100%;
            }
        }
    </style>
</head>

    <script>

        /* =====================================================
           SUPABASE
        ===================================================== */

        const SUPABASE_URL =
            "https://mgouzykkbpxjtgdvghoc.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_NE4Ah4WBvguxwcD85QSSGg_BxmdF0MP";

        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        /* =====================================================
           YOUR ACCOUNT
           ONLY THIS ACCOUNT CAN DELETE REPLIES
        ===================================================== */

        const OWNER_ID =
            "ee944573-14bb-42f7-9cbb-44e28c9d39bd";


        /* =====================================================
           LOGIN UI
        ===================================================== */

        function toggleLogin(event) {

            if (event) {
                event.stopPropagation();
            }

            const box =
                document.getElementById("loginBox");

            const pfpBox =
                document.getElementById("pfpBox");

            pfpBox.style.display = "none";

            box.style.display =
                box.style.display === "none"
                    ? "block"
                    : "none";
        }


        function togglePfpBox(event) {

            if (event) {
                event.stopPropagation();
            }

            const box =
                document.getElementById("pfpBox");

            box.style.display =
                box.style.display === "none"
                    ? "block"
                    : "none";
        }


        /* =====================================================
           CLICK OUTSIDE TO CLOSE MENUS
        ===================================================== */

        document.addEventListener("click", function(event) {

            const loginBox =
                document.getElementById("loginBox");

            const pfpBox =
                document.getElementById("pfpBox");

            const loginButton =
                document.getElementById("loginButton");

            const userDisplay =
                document.getElementById("userDisplay");


            if (
                !loginBox.contains(event.target) &&
                event.target !== loginButton
            ) {
                loginBox.style.display = "none";
            }


            if (
                !pfpBox.contains(event.target) &&
                !userDisplay.contains(event.target)
            ) {
                pfpBox.style.display = "none";
            }

        });


        /* =====================================================
           SIGN UP
        ===================================================== */

        async function signup() {

            const username =
                document
                    .getElementById("username")
                    .value
                    .trim();

            const password =
                document
                    .getElementById("password")
                    .value;


            const message =
                document.getElementById("loginMessage");


            if (!username || !password) {

                message.textContent =
                    "Enter a username and password.";

                return;
            }


            if (username.length < 3) {

                message.textContent =
                    "Username must be at least 3 characters.";

                return;
            }


            if (password.length < 6) {

                message.textContent =
                    "Password must be at least 6 characters.";

                return;
            }


            const fakeEmail =
                username.toLowerCase() +
                "@geewhizard.local";


            const {
                data,
                error
            } = await supabaseClient.auth.signUp({

                email: fakeEmail,

                password: password

            });


            if (error) {

                message.textContent =
                    error.message;

                return;
            }


            if (!data.user) {

                message.textContent =
                    "Something went wrong.";

                return;
            }


            const {
                error: profileError
            } = await supabaseClient
                .from("profiles")
                .insert({

                    id: data.user.id,

                    username: username,

                    avatar_url: null

                });


            if (profileError) {

                message.textContent =
                    "Account created, but profile setup failed: " +
                    profileError.message;

                return;
            }


            message.textContent =
                "Account created!";

            await updateUserDisplay();

        }


        /* =====================================================
           LOGIN
        ===================================================== */

        async function login() {

            const username =
                document
                    .getElementById("username")
                    .value
                    .trim();

            const password =
                document
                    .getElementById("password")
                    .value;


            const message =
                document.getElementById("loginMessage");


            if (!username || !password) {

                message.textContent =
                    "Enter your username and password.";

                return;
            }


            const fakeEmail =
                username.toLowerCase() +
                "@geewhizard.local";


            const {
                error
            } = await supabaseClient.auth.signInWithPassword({

                email: fakeEmail,

                password: password

            });


            if (error) {

                message.textContent =
                    error.message;

                return;
            }


            message.textContent =
                "Logged in!";


            document.getElementById("loginBox")
                .style.display = "none";


            await updateUserDisplay();

            await loadPosts();

        }


        /* =====================================================
           LOGOUT
        ===================================================== */

        async function logout() {

            await supabaseClient.auth.signOut();

            document.getElementById("userDisplay")
                .style.display = "none";

            document.getElementById("loginButton")
                .style.display = "block";

            document.getElementById("pfpBox")
                .style.display = "none";

            await loadPosts();

        }


        /* =====================================================
           UPDATE USER DISPLAY
        ===================================================== */

        async function updateUserDisplay() {

            const {
                data: {
                    user
                }
            } = await supabaseClient.auth.getUser();


            if (!user) {

                document.getElementById("userDisplay")
                    .style.display = "none";

                document.getElementById("loginButton")
                    .style.display = "block";

                return;
            }


            const {
                data: profile
            } = await supabaseClient
                .from("profiles")
                .select("username, avatar_url")
                .eq("id", user.id)
                .single();


            document.getElementById("loginButton")
                .style.display = "none";


            document.getElementById("userDisplay")
                .style.display = "flex";


            document.getElementById("usernameDisplay")
                .textContent =
                    "Logged in as " +
                    (profile?.username || "User");


            document.getElementById("userPfp")
                .src =
                    profile?.avatar_url ||
                    "whizardpfp.png";

        }


        /* =====================================================
           IMAGE PROCESSING
           MAKES PFP SQUARE
        ===================================================== */

        function processImage(file) {

            return new Promise((resolve, reject) => {

                const reader =
                    new FileReader();


                reader.onload = function(event) {

                    const img =
                        new Image();


                    img.onload = function() {

                        const size =
                            Math.min(
                                img.width,
                                img.height
                            );


                        const sx =
                            (img.width - size) / 2;

                        const sy =
                            (img.height - size) / 2;


                        const canvas =
                            document.createElement("canvas");


                        canvas.width = 256;
                        canvas.height = 256;


                        const ctx =
                            canvas.getContext("2d");


                        ctx.drawImage(
                            img,
                            sx,
                            sy,
                            size,
                            size,
                            0,
                            0,
                            256,
                            256
                        );


                        canvas.toBlob(
                            blob => {

                                if (!blob) {

                                    reject(
                                        new Error(
                                            "Could not process image."
                                        )
                                    );

                                    return;
                                }


                                resolve(blob);

                            },
                            "image/jpeg",
                            0.75
                        );

                    };


                    img.onerror =
                        reject;


                    img.src =
                        event.target.result;

                };


                reader.onerror =
                    reject;


                reader.readAsDataURL(file);

            });

        }


        /* =====================================================
           UPLOAD PFP
        ===================================================== */

        async function uploadPfp() {

            const input =
                document.getElementById("pfpInput");

            const message =
                document.getElementById("pfpMessage");


            const file =
                input.files[0];


            if (!file) {

                message.textContent =
                    "Choose an image first.";

                return;
            }


            const {
                data: {
                    user
                }
            } = await supabaseClient.auth.getUser();


            if (!user) {

                message.textContent =
                    "You need to be logged in.";

                return;
            }


            try {

                message.textContent =
                    "Processing image...";


                const processed =
                    await processImage(file);


                const path =
                    user.id +
                    "/avatar.jpg";


                message.textContent =
                    "Uploading...";


                const {
                    error: uploadError
                } = await supabaseClient
                    .storage
                    .from("avatars")
                    .upload(
                        path,
                        processed,
                        {
                            contentType:
                                "image/jpeg",

                            upsert: true
                        }
                    );


                if (uploadError) {

                    message.textContent =
                        "Upload failed: " +
                        uploadError.message;

                    return;
                }


                const {
                    data: publicData
                } =
                    supabaseClient
                        .storage
                        .from("avatars")
                        .getPublicUrl(path);


                const avatarUrl =
                    publicData.publicUrl +
                    "?t=" +
                    Date.now();


                const {
                    error: profileError
                } = await supabaseClient
                    .from("profiles")
                    .update({

                        avatar_url:
                            avatarUrl

                    })
                    .eq(
                        "id",
                        user.id
                    );


                if (profileError) {

                    message.textContent =
                        "Profile update failed: " +
                        profileError.message;

                    return;
                }


                document.getElementById("userPfp")
                    .src =
                    avatarUrl;


                message.textContent =
                    "Profile picture updated!";


                input.value = "";


                await loadPosts();

            }

            catch (error) {

                message.textContent =
                    "Error: " +
                    error.message;

            }

        }


        /* =====================================================
           LOAD POSTS
        ===================================================== */

        async function loadPosts() {

            const postsContainer =
                document.getElementById("posts");


            postsContainer.innerHTML =
                "<p>Loading...</p>";


            const {
                data: posts,
                error: postsError
            } = await supabaseClient
                .from("posts")
                .select("*")
                .order(
                    "created_at",
                    {
                        ascending: false
                    }
                );


            if (postsError) {

                postsContainer.innerHTML =
                    "<p>Error loading posts: " +
                    postsError.message +
                    "</p>";

                return;
            }


            /* Get all replies */

            const {
                data: replies,
                error: repliesError
            } = await supabaseClient
                .from("replies")
                .select("*")
                .order(
                    "created_at",
                    {
                        ascending: true
                    }
                );


            if (repliesError) {

                console.error(
                    "Reply loading error:",
                    repliesError
                );

            }


            /* Get profiles for reply authors */

            const replyUserIds =
                [
                    ...new Set(
                        (replies || [])
                            .map(reply =>
                                reply.user_id
                            )
                    )
                ];


            let profiles = [];


            if (replyUserIds.length > 0) {

                const {
                    data: profileData,
                    error: profileError
                } = await supabaseClient
                    .from("profiles")
                    .select(
                        "id, username, avatar_url"
                    )
                    .in(
                        "id",
                        replyUserIds
                    );


                if (!profileError) {

                    profiles =
                        profileData || [];

                }

            }


            const profileMap = {};


            profiles.forEach(profile => {

                profileMap[profile.id] =
                    profile;

            });


            postsContainer.innerHTML = "";


            if (!posts || posts.length === 0) {

                postsContainer.innerHTML =
                    "<p>No posts yet.</p>";

                return;
            }


            posts.forEach(post => {

                const postElement =
                    document.createElement("div");

                postElement.className =
                    "post";


                /* Main post author */

                const author =
                    document.createElement("div");

                author.className =
                    "post-author";


                const authorPfp =
                    document.createElement("img");

                authorPfp.className =
                    "post-author-pfp";

                authorPfp.src =
                    "whizardpfp.png";

                authorPfp.alt =
                    "Geewhizard";


                const authorInfo =
                    document.createElement("div");


                const authorName =
                    document.createElement("div");

                authorName.className =
                    "main-author-name";

                authorName.textContent =
                    "Geewhizard";


                const date =
                    document.createElement("span");

                date.className =
                    "post-date";

                date.textContent =
                    formatDate(
                        post.created_at
                    );


                authorInfo.appendChild(
                    authorName
                );

                authorInfo.appendChild(
                    date
                );


                author.appendChild(
                    authorPfp
                );

                author.appendChild(
                    authorInfo
                );


                /* Post content */

                const content =
                    document.createElement("div");

                content.className =
                    "post-content";

                content.textContent =
                    post.content;


                /* Vote buttons */

                const voteButtons =
                    document.createElement("div");

                voteButtons.className =
                    "vote-buttons";


                const upButton =
                    document.createElement("button");

                upButton.textContent =
                    "👍 " +
                    (post.upvotes || 0);


                upButton.onclick =
                    () => vote(
                        post.id,
                        "up"
                    );


                const downButton =
                    document.createElement("button");

                downButton.textContent =
                    "👎 " +
                    (post.downvotes || 0);


                downButton.onclick =
                    () => vote(
                        post.id,
                        "down"
                    );


                voteButtons.appendChild(
                    upButton
                );

                voteButtons.appendChild(
                    downButton
                );


                /* Replies */

                const repliesContainer =
                    document.createElement("div");

                repliesContainer.className =
                    "replies";


                const repliesTitle =
                    document.createElement("div");

                repliesTitle.className =
                    "replies-title";

                repliesTitle.textContent =
                    "💬 Replies";


                repliesContainer.appendChild(
                    repliesTitle
                );


                const postReplies =
                    (replies || [])
                        .filter(
                            reply =>
                                Number(reply.post_id) ===
                                Number(post.id)
                        );


                postReplies.forEach(reply => {

                    const profile =
                        profileMap[
                            reply.user_id
                        ];


                    const replyElement =
                        document.createElement("div");

                    replyElement.className =
                        "reply";


                    const replyPfp =
                        document.createElement("img");

                    replyPfp.className =
                        "reply-pfp";

                    replyPfp.src =
                        profile?.avatar_url ||
                        "whizardpfp.png";

                    replyPfp.alt =
                        "Profile picture";


                    const replyBody =
                        document.createElement("div");

                    replyBody.className =
                        "reply-body";


                    const replyHeader =
                        document.createElement("div");

                    replyHeader.className =
                        "reply-header";


                    const replyUsername =
                        document.createElement("span");

                    replyUsername.className =
                        "reply-username";

                    replyUsername.textContent =
                        profile?.username ||
                        "User";


                    const replyDate =
                        document.createElement("span");

                    replyDate.className =
                        "reply-date";

                    replyDate.textContent =
                        formatDate(
                            reply.created_at
                        );


                    replyHeader.appendChild(
                        replyUsername
                    );

                    replyHeader.appendChild(
                        replyDate
                    );


                    /*
                       ONLY GEewhizard gets
                       the delete button.
                    */

                    if (
                        currentUserId &&
                        currentUserId === OWNER_ID
                    ) {

                        const deleteButton =
                            document.createElement("button");

                        deleteButton.className =
                            "delete-reply";

                        deleteButton.textContent =
                            "Delete";


                        deleteButton.onclick =
                            () => deleteReply(
                                reply.id
                            );


                        replyHeader.appendChild(
                            deleteButton
                        );

                    }


                    const replyContent =
                        document.createElement("div");

                    replyContent.className =
                        "reply-content";

                    replyContent.textContent =
                        reply.content;


                    replyBody.appendChild(
                        replyHeader
                    );

                    replyBody.appendChild(
                        replyContent
                    );


                    replyElement.appendChild(
                        replyPfp
                    );

                    replyElement.appendChild(
                        replyBody
                    );


                    repliesContainer.appendChild(
                        replyElement
                    );

                });


                /* Reply form */

                const replyForm =
                    document.createElement("div");

                replyForm.className =
                    "reply-form";


                const replyInput =
                    document.createElement("input");

                replyInput.className =
                    "reply-input";

                replyInput.type =
                    "text";

                replyInput.placeholder =
                    "Write a reply...";

                replyInput.maxLength =
                    500;


                const replyButton =
                    document.createElement("button");

                replyButton.className =
                    "reply-submit";

                replyButton.textContent =
                    "Reply";


                replyButton.onclick =
                    () => submitReply(
                        post.id,
                        replyInput
                    );


                replyInput.addEventListener(
                    "keydown",
                    function(event) {

                        if (
                            event.key === "Enter"
                        ) {

                            event.preventDefault();

                            submitReply(
                                post.id,
                                replyInput
                            );

                        }

                    }
                );


                replyForm.appendChild(
                    replyInput
                );

                replyForm.appendChild(
                    replyButton
                );


                repliesContainer.appendChild(
                    replyForm
                );


                /* Build post */

                postElement.appendChild(
                    author
                );

                postElement.appendChild(
                    content
                );

                postElement.appendChild(
                    voteButtons
                );

                postElement.appendChild(
                    repliesContainer
                );


                postsContainer.appendChild(
                    postElement
                );

            });

        }


        /* =====================================================
           CURRENT USER
        ===================================================== */

        let currentUserId = null;


        async function getCurrentUser() {

            const {
                data: {
                    user
                }
            } = await supabaseClient.auth.getUser();


            currentUserId =
                user
                    ? user.id
                    : null;


            return user;

        }


        /* =====================================================
           SUBMIT REPLY
        ===================================================== */

        async function submitReply(
            postId,
            input
        ) {

            const user =
                await getCurrentUser();


            if (!user) {

                alert(
                    "You need to log in to reply."
                );

                return;
            }


            const content =
                input.value.trim();


            if (!content) {

                return;
            }


            if (content.length > 500) {

                alert(
                    "Replies can only be 500 characters."
                );

                return;
            }


            const {
                error
            } = await supabaseClient
                .from("replies")
                .insert({

                    post_id:
                        postId,

                    user_id:
                        user.id,

                    content:
                        content

                });


            if (error) {

                alert(
                    "Could not post reply: " +
                    error.message
                );

                return;
            }


            input.value = "";


            await loadPosts();

        }


        /* =====================================================
           DELETE REPLY
           RLS ALSO PROTECTS THIS SERVER-SIDE
        ===================================================== */

        async function deleteReply(
            replyId
        ) {

            const user =
                await getCurrentUser();


            if (!user) {

                return;
            }


            if (
                user.id !== OWNER_ID
            ) {

                alert(
                    "You cannot delete replies."
                );

                return;
            }


            const confirmed =
                confirm(
                    "Delete this reply?"
                );


            if (!confirmed) {

                return;
            }


            const {
                error
            } = await supabaseClient
                .from("replies")
                .delete()
                .eq(
                    "id",
                    replyId
                );


            if (error) {

                alert(
                    "Could not delete reply: " +
                    error.message
                );

                return;
            }


            await loadPosts();

        }


        /* =====================================================
           VOTING
        ===================================================== */

        async function vote(
            postId,
            voteType
        ) {

            const user =
                await getCurrentUser();


            if (!user) {

                alert(
                    "You need to log in to vote."
                );

                return;
            }


            const {
                data: existingVote,
                error: voteFetchError
            } = await supabaseClient
                .from("post_votes")
                .select("*")
                .eq(
                    "post_id",
                    postId
                )
                .eq(
                    "user_id",
                    user.id
                )
                .maybeSingle();


            if (voteFetchError) {

                alert(
                    voteFetchError.message
                );

                return;
            }


            /* Remove existing vote */

            if (
                existingVote &&
                existingVote.vote_type === voteType
            ) {

                const {
                    error
                } = await supabaseClient
                    .from("post_votes")
                    .delete()
                    .eq(
                        "id",
                        existingVote.id
                    );


                if (error) {

                    alert(
                        error.message
                    );

                    return;
                }


                const column =
                    voteType === "up"
                        ? "upvotes"
                        : "downvotes";


                await changePostCount(
                    postId,
                    column,
                    -1
                );

            }


            /* Change vote */

            else if (
                existingVote
            ) {

                const oldType =
                    existingVote.vote_type;


                const {
                    error
                } = await supabaseClient
                    .from("post_votes")
                    .update({

                        vote_type:
                            voteType

                    })
                    .eq(
                        "id",
                        existingVote.id
                    );


                if (error) {

                    alert(
                        error.message
                    );

                    return;
                }


                const oldColumn =
                    oldType === "up"
                        ? "upvotes"
                        : "downvotes";


                const newColumn =
                    voteType === "up"
                        ? "upvotes"
                        : "downvotes";


                await changePostCount(
                    postId,
                    oldColumn,
                    -1
                );


                await changePostCount(
                    postId,
                    newColumn,
                    1
                );

            }


            /* Create new vote */

            else {

                const {
                    error
                } = await supabaseClient
                    .from("post_votes")
                    .insert({

                        post_id:
                            postId,

                        user_id:
                            user.id,

                        vote_type:
                            voteType

                    });


                if (error) {

                    alert(
                        error.message
                    );

                    return;
                }


                const column =
                    voteType === "up"
                        ? "upvotes"
                        : "downvotes";


                await changePostCount(
                    postId,
                    column,
                    1
                );

            }


            await loadPosts();

        }


        /* =====================================================
           CHANGE POST VOTE COUNT
        ===================================================== */

        async function changePostCount(
            postId,
            column,
            amount
        ) {

            const {
                data: post,
                error: fetchError
            } = await supabaseClient
                .from("posts")
                .select(
                    column
                )
                .eq(
                    "id",
                    postId
                )
                .single();


            if (fetchError) {

                console.error(
                    fetchError
                );

                return;
            }


            const current =
                Number(
                    post[column] || 0
                );


            const newValue =
                Math.max(
                    0,
                    current + amount
                );


            const update = {};

            update[column] =
                newValue;


            const {
                error
            } = await supabaseClient
                .from("posts")
                .update(
                    update
                )
                .eq(
                    "id",
                    postId
                );


            if (error) {

                console.error(
                    error
                );

            }

        }


        /* =====================================================
           DATE FORMAT
        ===================================================== */

        function formatDate(
            date
        ) {

            if (!date) {
                return "";
            }


            return new Date(
                date
            ).toLocaleString();

        }


        /* =====================================================
           STARTUP
        ===================================================== */

        async function start() {

            await getCurrentUser();

            await updateUserDisplay();

            await loadPosts();

        }


        start();


        /* =====================================================
           AUTH STATE CHANGES
        ===================================================== */

        supabaseClient.auth.onAuthStateChange(
            async function() {

                await getCurrentUser();

                await updateUserDisplay();

                await loadPosts();

            }
        );

    </script>
