<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>geewhizard.com</title>

    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="style.css">

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Your JavaScript -->
    <script src="script.js" defer></script>

    <style>
        /* Profile Picture button */
        #pfpToggle {
            position: absolute;
            top: 15px;
            right: 105px;
            z-index: 10000;

            width: auto;
            padding: 10px 14px;

            background: black;
            color: white;

            border: 2px solid white;
            border-radius: 10px;

            font-family: "Comic Sans MS", cursive;
            font-size: 16px;

            cursor: pointer;
        }

        #pfpToggle:hover {
            background: #333;
        }

        /* Go to bottom button */
        #bottomButton {
            display: block;

            margin: 15px auto;
            padding: 10px 18px;

            background: black;
            color: white;

            border: 2px solid white;
            border-radius: 10px;

            font-family: "Comic Sans MS", cursive;
            font-size: 16px;

            cursor: pointer;
        }

        #bottomButton:hover {
            background: #333;
        }
    </style>
</head>

<body>

    <!-- LOGIN BUTTON -->
    <button id="loginButton" onclick="toggleLogin()">
        Login
    </button>

    <!-- PROFILE PICTURE BUTTON -->
    <button id="pfpToggle" onclick="togglePfpBox()" style="display:none;">
        ▼ Profile Picture
    </button>

    <!-- USER NAME -->
    <div id="userDisplay"></div>

    <!-- LOGIN BOX -->
    <div id="loginBox" style="display:none;">

        <h2>Login</h2>

        <input
            type="text"
            id="username"
            placeholder="Username"
        >

        <input
            type="password"
            id="password"
            placeholder="Password"
        >

        <button onclick="login()">
            Login
        </button>

        <button onclick="signup()">
            Sign Up
        </button>

        <p id="loginMessage"></p>

    </div>


    <!-- PROFILE PICTURE BOX -->
    <div id="pfpBox" style="display:none;">

        <div id="pfpContent">

            <h2>Profile Picture</h2>

            <img
                id="currentPfp"
                src="whizardpfp.png"
                alt="Profile Picture"
            >

            <br><br>

            <input
                type="file"
                id="pfpInput"
                accept="image/*"
            >

            <button onclick="uploadPfp()">
                Upload Picture
            </button>

            <p id="pfpMessage"></p>

        </div>

    </div>


    <!-- POST CREATOR -->
    <div id="postComposer" style="display:none;">

        <h2>Make a Post</h2>

        <textarea
            id="postContent"
            placeholder="What do you want to say?"
        ></textarea>

        <br><br>

        <input
            type="file"
            id="postImage"
            accept="image/*"
            onchange="previewPostImage()"
        >

        <br>

        <img
            id="postImagePreview"
            style="display:none; max-width:100%;"
        >

        <br>

        <button onclick="createPost()">
            Post
        </button>

        <p id="postMessage"></p>

    </div>


    <!-- PAGE TITLE -->
    <h1>
        welcome to geewhizard.com
    </h1>


    <!-- GO TO BOTTOM BUTTON -->
    <button id="bottomButton" onclick="goToBottom()">
        ⬇ Go to Bottom
    </button>


    <!-- POSTS -->
    <div id="posts">
        Loading posts...
    </div>


    <!-- WHIZ MENU / GIF AREA -->
    <div class="whiz-menu">

        <a href="https://geewhizard.com">
            <img
                src="whiz menu.png"
                alt="Whiz Menu"
            >
        </a>

    </div>

</body>
</html>
