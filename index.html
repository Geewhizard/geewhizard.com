        const SUPABASE_KEY =

        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        async function loadPosts() {

            const postsDiv =
                document.getElementById("posts");


            const { data, error } =
                await supabaseClient
                    .from("posts")
                    .select("*")
                    .order("created_at", {
                        ascending: false
                    });


            if (error) {

                console.error(
                    "Error loading posts:",
                    error
                );

                postsDiv.textContent =
                    "Could not load posts.";

                return;
            }


            postsDiv.innerHTML = "";


            data.forEach(post => {

                const postElement =
                    document.createElement("div");

                postElement.className = "post";

                postElement.textContent =
                    post.content;

                postsDiv.appendChild(
                    postElement
                );

            });

        }


        // Load posts when the page opens
        loadPosts();

    </script>
