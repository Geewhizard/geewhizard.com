    <script>

        // =========================
        // SUPABASE
        // =========================

        const SUPABASE_URL =
            "https://mgouzykkbpxjtgdvghoc.supabase.co";


        const SUPABASE_KEY =
            "sb_publishable_NE4Ah4WBvguxwcD85QSSGg_BxmdF0MP";


        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        // =========================
        // GEEWHIZARD ACCOUNT
        // =========================

        const OWNER_ID =
            "ee944573-14bb-42f7-9cbb-44e28c9d39bd";


        let currentUserId = null;


        // =========================
        // LOGIN
        // =========================

        function toggleLogin(event) {

            if (event) {
                event.stopPropagation();
            }

            const box =
                document.getElementById(
                    "loginBox"
                );

            const pfpBox =
                document.getElementById(
                    "pfpBox"
                );

            pfpBox.style.display =
                "none";

            if (
                box.style.display ===
                "block"
            ) {

                box.style.display =
                    "none";

            } else {

                box.style.display =
                    "block";

            }

        }


        // =========================
        // SIGN UP
        // =========================

        async function signup() {

            const username =
                document
                    .getElementById(
                        "username"
                    )
                    .value
                    .trim();


            const password =
                document
                    .getElementById(
                        "password"
                    )
                    .value;


            const status =
                document.getElementById(
                    "loginStatus"
                );


            if (!username || !password) {

                status.textContent =
                    "Enter a username and password.";

                return;
            }


            if (password.length < 6) {

                status.textContent =
                    "Password must be at least 6 characters.";

                return;
            }


            const email =
                username.toLowerCase() +
                "@geewhizard.local";


            const {
                data,
                error
            } =
                await supabaseClient.auth
                    .signUp({

                        email:
                            email,

                        password:
                            password

                    });


            if (error) {

                status.textContent =
                    error.message;

                return;
            }


            if (data.user) {

                const {
                    error: profileError
                } =
                    await supabaseClient
                        .from("profiles")
                        .insert({

                            id:
                                data.user.id,

                            username:
                                username,

                            avatar_url:
                                null

                        });


                if (profileError) {

                    console.error(
                        profileError
                    );

                    status.textContent =
                        "Account created, but username could not be saved.";

                    return;
                }

            }


            status.textContent =
                "Account created!";


            await updateUserDisplay();

            await loadPosts();

        }


        // =========================
        // LOGIN
        // =========================

        async function login() {

            const username =
                document
                    .getElementById(
                        "username"
                    )
                    .value
                    .trim();


            const password =
                document
                    .getElementById(
                        "password"
                    )
                    .value;


            const status =
                document.getElementById(
                    "loginStatus"
                );


            if (!username || !password) {

                status.textContent =
                    "Enter a username and password.";

                return;
            }


            const email =
                username.toLowerCase() +
                "@geewhizard.local";


            const {
                error
            } =
                await supabaseClient.auth
                    .signInWithPassword({

                        email:
                            email,

                        password:
                            password

                    });


            if (error) {

                status.textContent =
                    "Wrong username or password.";

                return;
            }


            status.textContent =
                "Logged in!";


            document.getElementById(
                "loginBox"
            ).style.display =
                "none";


            await updateUserDisplay();

            await loadPosts();

        }


        // =========================
        // LOGOUT
        // =========================

        async function logout(event) {

            if (event) {
                event.stopPropagation();
            }


            await supabaseClient.auth
                .signOut();


            document.getElementById(
                "loginBox"
            ).style.display =
                "none";


            document.getElementById(
                "pfpBox"
            ).style.display =
                "none";


            currentUserId =
                null;


            await updateUserDisplay();

            await loadPosts();

        }


        // =========================
        // PFP BOX
        // =========================

        function togglePfpBox(event) {

            if (event) {
                event.stopPropagation();
            }


            const box =
                document.getElementById(
                    "pfpBox"
                );


            document.getElementById(
                "loginBox"
            ).style.display =
                "none";


            if (
                box.style.display ===
                "block"
            ) {

                box.style.display =
                    "none";

            } else {

                box.style.display =
                    "block";

            }

        }


        // =========================
        // PROCESS PFP
        // =========================

        function processImage(file) {

            return new Promise(
                (resolve, reject) => {

                    const image =
                        new Image();


                    image.onload =
                        function() {

                            const size =
                                Math.min(
                                    image.width,
                                    image.height
                                );


                            const canvas =
                                document.createElement(
                                    "canvas"
                                );


                            const outputSize =
                                256;


                            canvas.width =
                                outputSize;


                            canvas.height =
                                outputSize;


                            const ctx =
                                canvas.getContext(
                                    "2d"
                                );


                            const cropX =
                                (
                                    image.width -
                                    size
                                ) / 2;


                            const cropY =
                                (
                                    image.height -
                                    size
                                ) / 2;


                            ctx.drawImage(

                                image,

                                cropX,
                                cropY,

                                size,
                                size,

                                0,
                                0,

                                outputSize,
                                outputSize

                            );


                            canvas.toBlob(

                                function(blob) {

                                    if (!blob) {

                                        reject(
                                            new Error(
                                                "Could not compress image."
                                            )
                                        );

                                        return;
                                    }


                                    resolve(blob);

                                },

                                "image/jpeg",

                                0.75

                            );

                        };


                    image.onerror =
                        function() {

                            reject(
                                new Error(
                                    "Could not read image."
                                )
                            );

                        };


                    image.src =
                        URL.createObjectURL(
                            file
                        );

                }
            );

        }


        // =========================
        // UPLOAD PFP
        // =========================

        async function uploadPfp() {

            const input =
                document.getElementById(
                    "pfpInput"
                );


            const status =
                document.getElementById(
                    "pfpStatus"
                );


            const file =
                input.files[0];


            if (!file) {

                status.textContent =
                    "Choose an image first.";

                return;
            }


            const {
                data: {
                    user
                }
            } =
                await supabaseClient.auth
                    .getUser();


            if (!user) {

                status.textContent =
                    "You need to be logged in.";

                return;
            }


            status.textContent =
                "Processing image...";


            try {

                const compressedImage =
                    await processImage(
                        file
                    );


                status.textContent =
                    "Uploading...";


                const filePath =
                    user.id +
                    "/avatar.jpg";


                const {
                    error: uploadError
                } =
                    await supabaseClient
                        .storage
                        .from("avatars")
                        .upload(

                            filePath,

                            compressedImage,

                            {

                                contentType:
                                    "image/jpeg",

                                upsert:
                                    true

                            }

                        );


                if (uploadError) {

                    console.error(
                        uploadError
                    );

                    status.textContent =
                        "Upload failed: " +
                        uploadError.message;

                    return;
                }


                const {
                    data: publicUrlData
                } =
                    supabaseClient
                        .storage
                        .from("avatars")
                        .getPublicUrl(
                            filePath
                        );


                const avatarUrl =
                    publicUrlData.publicUrl +
                    "?t=" +
                    Date.now();


                const {
                    error: profileError
                } =
                    await supabaseClient
                        .from("profiles")
                        .update({

                            avatar_url:
                                avatarUrl

                        })
                        .eq(
                            "id",
                            user.id
                        );


                if (profileError) {

                    console.error(
                        profileError
                    );

                    status.textContent =
                        "Image uploaded, but profile could not be updated.";

                    return;
                }


                const pfp =
                    document.getElementById(
                        "userPfp"
                    );


                pfp.src =
                    avatarUrl;


                pfp.style.display =
                    "inline-block";


                status.textContent =
                    "Profile picture updated!";


                input.value = "";


                await loadPosts();

            }

            catch (error) {

                console.error(error);

                status.textContent =
                    "Something went wrong.";

            }

        }


        // =========================
        // UPDATE USER DISPLAY
        // =========================

        async function updateUserDisplay() {

            const {
                data: {
                    user
                }
            } =
                await supabaseClient.auth
                    .getUser();


            currentUserId =
                user
                    ? user.id

        // =========================
        // CREATE GEEWHIZARD POST
        // =========================

        async function createPost() {

            const {
                data: {
                    user
                }
            } =
                await supabaseClient.auth
                    .getUser();


            if (!user) {

                alert(
                    "You need to be logged in."
                );

                return;
            }


            // SECURITY CHECK

            if (
                user.id !==
                OWNER_ID
            ) {

                alert(
                    "Only Geewhizard can create posts."
                );

                return;
            }


            const text =
                document.getElementById(
                    "postText"
                ).value.trim();


            const imageInput =
                document.getElementById(
                    "postImage"
                );


            const imageFile =
                imageInput.files[0];


            const status =
                document.getElementById(
                    "postStatus"
                );


            const button =
                document.getElementById(
                    "publishPostButton"
                );


            if (
                !text &&
                !imageFile
            ) {

                status.textContent =
                    "Write something or choose an image.";

                return;
            }


            button.disabled =
                true;


            status.textContent =
                "Posting...";


            let imageUrl =
                null;


            try {

                // =========================
                // UPLOAD IMAGE FIRST
                // =========================

                if (imageFile) {

                    if (
                        !imageFile.type.startsWith(
                            "image/"
                        )
                    ) {

                        status.textContent =
                            "That isn't an image.";

                        button.disabled =
                            false;

                        return;
                    }


                    status.textContent =
                        "Uploading image...";


                    const extension =
                        imageFile.name
                            .split(".")
                            .pop()
                            .toLowerCase();


                    const safeExtension =
                        [
                            "jpg",
                            "jpeg",
                            "png",
                            "gif",
                            "webp"
                        ].includes(
                            extension
                        )
                            ? extension
                            : "jpg";


                    const fileName =
                        Date.now() +
                        "-" +
                        Math.random()
                            .toString(36)
                            .substring(
                                2,
                                10
                            ) +
                        "." +
                        safeExtension;


                    const filePath =
                        "posts/" +
                        fileName;


                    const {
                        error:
                            imageUploadError
                    } =
                        await supabaseClient
                            .storage
                            .from(
                                "post-images"
                            )
                            .upload(

                                filePath,

                                imageFile,

                                {

                                    contentType:
                                        imageFile.type,

                                    upsert:
                                        false

                                }

                            );


                    if (
                        imageUploadError
                    ) {

                        console.error(
                            imageUploadError
                        );

                        status.textContent =
                            "Image upload failed: " +
                            imageUploadError.message;

                        button.disabled =
                            false;

                        return;
                    }


                    const {
                        data:
                            publicUrlData
                    } =
                        supabaseClient
                            .storage
                            .from(
                                "post-images"
                            )
                            .getPublicUrl(
                                filePath
                            );


                    imageUrl =
                        publicUrlData
                            .publicUrl;

                }


                // =========================
                // CREATE POST
                // =========================

                status.textContent =
                    "Creating post...";


                const {
                    error:
                        postError
                } =
                    await supabaseClient
                        .from("posts")
                        .insert({

                            content:
                                text,

                            image_url:
                                imageUrl

                        });


                if (postError) {

                    console.error(
                        postError
                    );

                    status.textContent =
                        "Post failed: " +
                        postError.message;

                    button.disabled =
                        false;

                    return;
                }


                // =========================
                // CLEAR FORM
                // =========================

                document.getElementById(
                    "postText"
                ).value =
                    "";


                imageInput.value =
                    "";


                const preview =
                    document.getElementById(
                        "postImagePreview"
                    );


                preview.src =
                    "";


                preview.style.display =
                    "none";


                status.textContent =
                    "Posted!";


                button.disabled =
                    false;


                await loadPosts();

            }

            catch (error) {

                console.error(error);

                status.textContent =
                    "Something went wrong.";

                button.disabled =
                    false;

            }

        }

                    "Could not load posts.";

                return;

        // =========================
        // SUBMIT REPLY
        // =========================

        async function submitReply(
            postId,
            input
        ) {

            const {
                data: {
                    user
                }
            } =
                await supabaseClient.auth
                    .getUser();


            if (!user) {

                alert(
                    "You need to log in to reply."
                );

                return;
            }


            const content =
                input.value.trim();


            if (!content) {

                return;
            }


            if (
                content.length > 500
            ) {

                alert(
                    "Replies can only be 500 characters."
                );

                return;
            }


            const {
                error
            } =
                await supabaseClient
                    .from("replies")
                    .insert({

                        post_id:
                            postId,

                        user_id:
                            user.id,

                        content:
                            content

                    });


            if (error) {

                console.error(
                    error
                );

                alert(
                    "Could not post reply: " +
                    error.message
                );

                return;
            }


            input.value =
                "";


            await loadPosts();

        }


        // =========================
        // DELETE REPLY
        // =========================

        async function deleteReply(
            replyId
        ) {

            const {
                data: {
                    user
                }
            } =
                await supabaseClient.auth
                    .getUser();


            if (!user) {
                return;
            }


            if (
                user.id !==

            ) {

                alert(

                );

                return;
            }


            if (
                !confirm(

                )
            ) {

                return;
            }


            const {
                error
            } =
                await supabaseClient
                    .from("replies")
                    .delete()
                    .eq(
                        "id",
                        replyId
                    );


            if (error) {

                console.error(
                    error
                );

                alert(
                    "Could not delete reply: " +
                    error.message
                );

                return;
            }


            await loadPosts();

        }


        // =========================
        // VOTING
        // =========================

        async function vote(
            postId,
            voteType
        ) {

            const {
                data: {
                    user
                }
            } =
                await supabaseClient.auth
                    .getUser();


            if (!user) {

                alert(
                    "You need to log in before voting!"
                );

                return;
            }


            const {
                data: existingVote,
                error: findError
            } =
                await supabaseClient
                    .from("post_votes")
                    .select("*")
                    .eq(
                        "post_id",
                        postId
                    )
                    .eq(
                        "user_id",
                        user.id
                    )
                    .maybeSingle();


            if (findError) {

                console.error(
                    findError
                );

                return;
            }


            // REMOVE SAME VOTE

            if (
                existingVote &&
                existingVote.vote_type ===
                voteType
            ) {

                const {
                    error
                } =
                    await supabaseClient
                        .from("post_votes")
                        .delete()
                        .eq(
                            "id",
                            existingVote.id
                        );


                if (error) {

                    console.error(
                        error
                    );

                    return;
                }


                const column =
                    voteType === "up"
                        ? "upvotes"
                        : "downvotes";


                const {
                    data: post
                } =
                    await supabaseClient
                        .from("posts")
                        .select(
                            "upvotes, downvotes"
                        )
                        .eq(
                            "id",
                            postId
                        )
                        .single();


                if (post) {

                    await supabaseClient
                        .from("posts")
                        .update({

                            [column]:
                                Math.max(
                                    0,
                                    (
                                        post[column] ||
                                        0
                                    ) - 1
                                )

                        })
                        .eq(
                            "id",
                            postId
                        );

                }


                await loadPosts();

                return;

            }


            // CHANGE VOTE

            if (existingVote) {

                const newColumn =
                    voteType === "up"
                        ? "upvotes"
                        : "downvotes";


                const {
                    error:
                        changeError
                } =
                    await supabaseClient
                        .from("post_votes")
                        .update({

                            vote_type:
                                voteType

                        })
                        .eq(
                            "id",
                            existingVote.id
                        );


                if (changeError) {

                    console.error(
                        changeError
                    );

                    return;
                }


                const {
                    data: post
                } =
                    await supabaseClient
                        .from("posts")
                        .select(
                            "upvotes, downvotes"
                        )
                        .eq(
                            "id",
                            postId
                        )
                        .single();


                if (post) {

                    await supabaseClient
                        .from("posts")
                        .update({

                            upvotes:
                                Math.max(
                                    0,
                                    (
                                        post.upvotes ||
                                        0
                                    ) +
                                    (
                                        newColumn ===
                                        "upvotes"
                                            ? 1
                                            : -1
                                    )
                                ),

                            downvotes:
                                Math.max(
                                    0,
                                    (
                                        post.downvotes ||
                                        0
                                    ) +
                                    (
                                        newColumn ===
                                        "downvotes"
                                            ? 1
                                            : -1
                                    )
                                )

                        })
                        .eq(
                            "id",
                            postId
                        );

                }


                await loadPosts();

                return;

            }


            // FIRST VOTE

            const {
                error: insertError
            } =
                await supabaseClient
                    .from("post_votes")
                    .insert({

                        post_id:
                            postId,

                        user_id:
                            user.id,

                        vote_type:
                            voteType

                    });


            if (insertError) {

                console.error(
                    insertError
                );

                return;
            }


            const column =
                voteType === "up"
                    ? "upvotes"
                    : "downvotes";


            const {
                data: post
            } =
                await supabaseClient
                    .from("posts")
                    .select(
                        column
                    )
                    .eq(
                        "id",
                        postId
                    )
                    .single();


            if (post) {

                await supabaseClient
                    .from("posts")
                    .update({

                        [column]:
                            (
                                post[column] ||
                                0
                            ) + 1

                    })
                    .eq(
                        "id",
                        postId
                    );

            }


            await loadPosts();

        }

                        event.target
                    ) &&

                    event.target !==
                    changePfpButton
                ) {

                    pfpBox.style.display =
                        "none";

                }

            }
        );


        // =========================
        // AUTH STATE
        // =========================

        supabaseClient.auth.onAuthStateChange(
            async function() {

                await updateUserDisplay();

                await loadPosts();

            }
        );


        // =========================
        // START
        // =========================

        async function start() {

            await updateUserDisplay();

            await loadPosts();

        }


        start();

    </script>

</body>

</html>
