<!DOCTYPE html>
<html>

<head>
    <title>geepoopzard</title>

    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        /* =========================
           LOGIN BUTTON
           ========================= */

        #loginButton {
            position: absolute;
            top: 15px;
            left: 15px;
            z-index: 10000;

            color: white;
            cursor: pointer;

            font-family: "Comic Sans MS", cursive;
            font-size: 18px;

            text-decoration: underline;
        }


        /* =========================
           LOGIN BOX
           ========================= */

        #loginBox {
            display: none;

            position: absolute;
            top: 50px;
            left: 15px;

            width: 250px;

            padding: 20px;

            background: white;
            color: black;

            border-radius: 15px;

            box-shadow:
                0 5px 20px rgba(0, 0, 0, 0.5);

            z-index: 10001;

            text-align: left;
        }


        #loginBox input {
            width: 100%;

            padding: 8px;

            margin-bottom: 10px;

            border: 1px solid #aaa;

            border-radius: 7px;

            box-sizing: border-box;
        }


        #loginBox button {
            padding: 8px 12px;

            border: none;

            border-radius: 7px;

            cursor: pointer;

            margin-right: 5px;
        }


        #loginStatus {
            margin-top: 10px;

            font-size: 14px;
        }


        /* =========================
           USER DISPLAY
           ========================= */

        #userDisplay {
            display: none;

            position: absolute;

            top: 10px;
            left: 15px;

            color: white;

            font-family: "Comic Sans MS", cursive;

            font-size: 18px;

            z-index: 10000;

            align-items: center;

            gap: 8px;
        }


        /* PROFILE PICTURE */

        #userPfp {
            width: 40px;
            height: 40px;

            object-fit: cover;

            border-radius: 50%;

            display: none;

            border: 2px solid white;

            vertical-align: middle;
        }


        #logoutButton {
            color: white;

            cursor: pointer;

            text-decoration: underline;

            margin-left: 5px;
        }


        /* =========================
           PFP UPLOAD
           ========================= */

        #pfpBox {
            display: none;

            position: absolute;

            top: 60px;
            left: 15px;

            width: 250px;

            padding: 15px;

            background: white;

            color: black;

            border-radius: 15px;

            box-shadow:
                0 5px 20px rgba(0, 0, 0, 0.5);

            z-index: 10001;
        }


        #pfpBox input {
            width: 100%;

            box-sizing: border-box;

            margin-bottom: 10px;
        }


        #pfpBox button {
            padding: 8px 12px;

            border: none;

            border-radius: 7px;

            cursor: pointer;
        }


        #pfpStatus {
            margin-top: 8px;

            font-size: 14px;
        }


        /* =========================
           CHANGE PFP BUTTON
           ========================= */

        #changePfpButton {
            color: white;

            cursor: pointer;

            text-decoration: underline;

            margin-left: 5px;
        }

    </style>

</head>


<body>


    <!-- =========================
         LOGIN
         ========================= -->

    <div
        id="loginButton"
        onclick="toggleLogin(event)"
    >
        Login
    </div>


    <!-- =========================
         USER DISPLAY
         ========================= -->

    <div id="userDisplay">

        <img
            id="userPfp"
            src=""
            alt="Profile Picture"
        >

        <span>
            Logged in as
            <span id="usernameDisplay"></span>
        </span>

        <span
            id="changePfpButton"
            onclick="togglePfpBox(event)"
        >
            Change PFP
        </span>

        <span
            id="logoutButton"
            onclick="logout(event)"
        >
            Logout
        </span>

    </div>


    <!-- =========================
         LOGIN BOX
         ========================= -->

    <div id="loginBox">

        <h3>Login</h3>


        <input
            id="username"
            type="text"
            placeholder="Username"
        >


        <input
            id="password"
            type="password"
            placeholder="Password"
        >


        <button onclick="login()">
            Login
        </button>


        <button onclick="signup()">
            Sign Up
        </button>


        <div id="loginStatus"></div>

    </div>


    <!-- =========================
         PFP BOX
         ========================= -->

    <div id="pfpBox">

        <strong>Change Profile Picture</strong>

        <br><br>

        <input
            id="pfpInput"
            type="file"
            accept="image/*"
        >

        <button onclick="uploadPfp()">
            Upload
        </button>

        <div id="pfpStatus"></div>

    </div>


    <!-- =========================
         MAIN PAGE
         ========================= -->

    <h1>geewhizard.com</h1>


    <img
        src="whiz menu.png"
        class="whiz-menu"
        alt="Whizard Menu"
    >


    <div id="posts"></div>


    <!-- =========================
         GIF BUTTON
         ========================= -->

    <a
        href="page2.html"
        class="gif-button"
    >

        <img
            src="pE6RRnsQMPPDEBdPNHWQPaLvz3Q.png"
            class="still"
            alt="Wizard"
        >

        <img
            src="3dgifmaker13113.gif"
            class="animated"
            alt="Wizard"
        >

    </a>


    <script src="script.js"></script>


    <script>

        // =========================
        // SUPABASE
        // =========================

        const SUPABASE_URL =
            "https://mgouzykkbpxjtgdvghoc.supabase.co";


        const SUPABASE_KEY =
            "sb_publishable_NE4Ah4WBvguxwcD85QSSGg_BxmdF0MP";


        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        // =========================
        // LOGIN BOX
        // =========================

        function toggleLogin(event) {

            if (event) {
                event.stopPropagation();
            }

            const box =
                document.getElementById("loginBox");

            const pfpBox =
                document.getElementById("pfpBox");


            pfpBox.style.display = "none";


            if (box.style.display === "block") {

                box.style.display = "none";

            } else {

                box.style.display = "block";

            }

        }


        // =========================
        // SIGN UP
        // =========================

        async function signup() {

            const username =
                document
                    .getElementById("username")
                    .value
                    .trim();


            const password =
                document
                    .getElementById("password")
                    .value;


            const status =
                document.getElementById(
                    "loginStatus"
                );


            if (!username || !password) {

                status.textContent =
                    "Enter a username and password.";

                return;

            }


            if (password.length < 6) {

                status.textContent =
                    "Password must be at least 6 characters.";

                return;

            }


            const email =
                username.toLowerCase() +
                "@geewhizard.local";


            const { data, error } =
                await supabaseClient.auth.signUp({

                    email: email,

                    password: password

                });


            if (error) {

                status.textContent =
                    error.message;

                return;

            }


            if (data.user) {

                const {
                    error: profileError
                } =
                    await supabaseClient
                        .from("profiles")
                        .insert({

                            id: data.user.id,

                            username: username,

                            avatar_url: null

                        });


                if (profileError) {

                    console.error(
                        profileError
                    );

                    status.textContent =
                        "Account created, but username could not be saved.";

                    return;

                }

            }


            status.textContent =
                "Account created!";


            updateUserDisplay();

        }


        // =========================
        // LOGIN
        // =========================

        async function login() {

            const username =
                document
                    .getElementById("username")
                    .value
                    .trim();


            const password =
                document
                    .getElementById("password")
                    .value;


            const status =
                document.getElementById(
                    "loginStatus"
                );


            if (!username || !password) {

                status.textContent =
                    "Enter a username and password.";

                return;

            }


            const email =
                username.toLowerCase() +
                "@geewhizard.local";


            const { error } =
                await supabaseClient.auth
                    .signInWithPassword({

                        email: email,

                        password: password

                    });


            if (error) {

                status.textContent =
                    "Wrong username or password.";

                return;

            }


            status.textContent =
                "Logged in!";


            document.getElementById(
                "loginBox"
            ).style.display = "none";


            updateUserDisplay();

            loadPosts();

        }


        // =========================
        // LOGOUT
        // =========================

        async function logout(event) {

            if (event) {
                event.stopPropagation();
            }


            await supabaseClient.auth.signOut();


            document.getElementById(
                "loginBox"
            ).style.display = "none";


            document.getElementById(
                "pfpBox"
            ).style.display = "none";


            updateUserDisplay();

            loadPosts();

        }


        // =========================
        // PFP BOX
        // =========================

        function togglePfpBox(event) {

            if (event) {
                event.stopPropagation();
            }


            const box =
                document.getElementById(
                    "pfpBox"
                );


            document.getElementById(
                "loginBox"
            ).style.display = "none";


            if (box.style.display === "block") {

                box.style.display = "none";

            } else {

                box.style.display = "block";

            }

        }


        // =========================
        // RESIZE + COMPRESS IMAGE
        // =========================

        function processImage(file) {

            return new Promise(
                (resolve, reject) => {

                    const image =
                        new Image();


                    image.onload = function() {

                        const size =
                            Math.min(
                                image.width,
                                image.height
                            );


                        const canvas =
                            document.createElement(
                                "canvas"
                            );


                        const outputSize =
                            256;


                        canvas.width =
                            outputSize;


                        canvas.height =
                            outputSize;


                        const ctx =
                            canvas.getContext(
                                "2d"
                            );


                        // Find center square

                        const cropX =
                            (
                                image.width -
                                size
                            ) / 2;


                        const cropY =
                            (
                                image.height -
                                size
                            ) / 2;


                        // Draw square image

                        ctx.drawImage(

                            image,

                            cropX,
                            cropY,

                            size,
                            size,

                            0,
                            0,

                            outputSize,
                            outputSize

                        );


                        // Compress to JPEG

                        canvas.toBlob(

                            function(blob) {

                                if (!blob) {

                                    reject(
                                        new Error(
                                            "Could not compress image."
                                        )
                                    );

                                    return;

                                }


                                resolve(blob);

                            },

                            "image/jpeg",

                            0.75

                        );

                    };


                    image.onerror =
                        function() {

                            reject(
                                new Error(
                                    "Could not read image."
                                )
                            );

                        };


                    image.src =
                        URL.createObjectURL(
                            file
                        );

                }
            );

        }


        // =========================
        // UPLOAD PFP
        // =========================

        async function uploadPfp() {

            const input =
                document.getElementById(
                    "pfpInput"
                );


            const status =
                document.getElementById(
                    "pfpStatus"
                );


            const file =
                input.files[0];


            if (!file) {

                status.textContent =
                    "Choose an image first.";

                return;

            }


            const {
                data: { user }
            } =
                await supabaseClient.auth
                    .getUser();


            if (!user) {

                status.textContent =
                    "You need to be logged in.";

                return;

            }


            status.textContent =
                "Processing image...";


            try {

                // Make image square and compress it

                const compressedImage =
                    await processImage(file);


                status.textContent =
                    "Uploading...";


                // Every user gets their own folder

                const filePath =
                    user.id +
                    "/avatar.jpg";


                // Upload image

                const {
                    error: uploadError
                } =
                    await supabaseClient
                        .storage
                        .from("avatars")
                        .upload(

                            filePath,

                            compressedImage,

                            {

                                contentType:
                                    "image/jpeg",

                                upsert:
                                    true

                            }

                        );


                if (uploadError) {

                    console.error(
                        uploadError
                    );

                    status.textContent =
                        "Upload failed: " +
                        uploadError.message;

                    return;

                }


                // Get public URL

                const {
                    data: publicUrlData
                } =
                    supabaseClient
                        .storage
                        .from("avatars")
                        .getPublicUrl(
                            filePath
                        );


                const avatarUrl =
                    publicUrlData.publicUrl +
                    "?t=" +
                    Date.now();


                // Save URL to profile

                const {
                    error: profileError
                } =
                    await supabaseClient
                        .from("profiles")
                        .update({

                            avatar_url:
                                avatarUrl

                        })
                        .eq(
                            "id",
                            user.id
                        );


                if (profileError) {

                    console.error(
                        profileError
                    );

                    status.textContent =
                        "Image uploaded, but profile could not be updated.";

                    return;

                }


                // Update displayed PFP

                const pfp =
                    document.getElementById(
                        "userPfp"
                    );


                pfp.src =
                    avatarUrl;


                pfp.style.display =
                    "inline-block";


                status.textContent =
                    "Profile picture updated!";


                input.value = "";


            } catch (error) {

                console.error(error);

                status.textContent =
                    "Something went wrong.";

            }

        }


        // =========================
        // SHOW USER
        // =========================

        async function updateUserDisplay() {

            const {
                data: { user }
            } =
                await supabaseClient.auth
                    .getUser();


            const loginButton =
                document.getElementById(
                    "loginButton"
                );


            const userDisplay =
                document.getElementById(
                    "userDisplay"
                );


            const userPfp =
                document.getElementById(
                    "userPfp"
                );


            if (!user) {

                loginButton.style.display =
                    "block";


                userDisplay.style.display =
                    "none";


                userPfp.style.display =
                    "none";


                return;

            }


            const { data: profile } =
                await supabaseClient
                    .from("profiles")
                    .select(
                        "username, avatar_url"
                    )
                    .eq(
                        "id",
                        user.id
                    )
                    .single();


            if (profile) {

                document.getElementById(
                    "usernameDisplay"
                ).textContent =
                    profile.username;


                if (profile.avatar_url) {

                    userPfp.src =
                        profile.avatar_url;


                    userPfp.style.display =
                        "inline-block";

                } else {

                    userPfp.style.display =
                        "none";

                }

            }


            loginButton.style.display =
                "none";


            userDisplay.style.display =
                "flex";

        }


        // =========================
        // LOAD POSTS
        // =========================

        async function loadPosts() {

            const postsDiv =
                document.getElementById(
                    "posts"
                );


            const { data, error } =
                await supabaseClient
                    .from("posts")
                    .select("*")
                    .order(
                        "created_at",
                        {
                            ascending: false
                        }
                    );


            if (error) {

                console.error(error);

                postsDiv.textContent =
                    "Could not load posts.";

                return;

            }


            postsDiv.innerHTML = "";


            data.forEach(post => {

                const postElement =
                    document.createElement(
                        "div"
                    );


                postElement.className =
                    "post";


                const content =
                    document.createElement(
                        "div"
                    );


                content.className =
                    "post-content";


                content.textContent =
                    post.content;


                const votes =
                    document.createElement(
                        "div"
                    );


                votes.className =
                    "votes";


                const upvote =
                    document.createElement(
                        "button"
                    );


                upvote.textContent =
                    "⬆ " +
                    (post.upvotes || 0);


                const downvote =
                    document.createElement(
                        "button"
                    );


                downvote.textContent =
                    "⬇ " +
                    (post.downvotes || 0);


                upvote.onclick = () =>
                    vote(
                        post.id,
                        "up"
                    );


                downvote.onclick = () =>
                    vote(
                        post.id,
                        "down"
                    );


                votes.appendChild(
                    upvote
                );


                votes.appendChild(
                    downvote
                );


                postElement.appendChild(
                    content
                );


                postElement.appendChild(
                    votes
                );


                postsDiv.appendChild(
                    postElement
                );

            });

        }


        // =========================
        // VOTING
        // =========================

        async function vote(
            postId,
            voteType
        ) {

            const {
                data: { user }
            } =
                await supabaseClient.auth
                    .getUser();


            if (!user) {

                alert(
                    "You need to log in before voting!"
                );

                return;

            }


            const {
                data: existingVote,
                error: findError
            } =
                await supabaseClient
                    .from("post_votes")
                    .select("*")
                    .eq(
                        "post_id",
                        postId
                    )
                    .eq(
                        "user_id",
                        user.id
                    )
                    .maybeSingle();


            if (findError) {

                console.error(
                    findError
                );

                return;

            }


            // =========================
            // REMOVE SAME VOTE
            // =========================

            if (
                existingVote &&
                existingVote.vote_type ===
                voteType
            ) {

                const { error } =
                    await supabaseClient
                        .from("post_votes")
                        .delete()
                        .eq(
                            "id",
                            existingVote.id
                        );


                if (error) {

                    console.error(
                        error
                    );

                    return;

                }


                const column =
                    voteType === "up"
                        ? "upvotes"
                        : "downvotes";


                const { data: post } =
                    await supabaseClient
                        .from("posts")
                        .select(
                            "upvotes, downvotes"
                        )
                        .eq(
                            "id",
                            postId
                        )
                        .single();


                await supabaseClient
                    .from("posts")
                    .update({

                        [column]:
                            Math.max(
                                0,
                                (post[column] || 0) - 1
                            )

                    })
                    .eq(
                        "id",
                        postId
                    );


                loadPosts();

                return;

            }


            // =========================
            // CHANGE VOTE
            // =========================

            if (existingVote) {

                const oldColumn =
                    existingVote.vote_type === "up"
                        ? "upvotes"
                        : "downvotes";


                const newColumn =
                    voteType === "up"
                        ? "upvotes"
                        : "downvotes";


                await supabaseClient
                    .from("post_votes")
                    .update({

                        vote_type:
                            voteType

                    })
                    .eq(
                        "id",
                        existingVote.id
                    );


                const { data: post } =
                    await supabaseClient
                        .from("posts")
                        .select(
                            "upvotes, downvotes"
                        )
                        .eq(
                            "id",
                            postId
                        )
                        .single();


                await supabaseClient
                    .from("posts")
                    .update({

                        upvotes:
                            Math.max(
                                0,
                                (post.upvotes || 0) +
                                (
                                    newColumn ===
                                    "upvotes"
                                        ? 1
                                        : -1
                                )
                            ),

                        downvotes:
                            Math.max(
                                0,
                                (post.downvotes || 0) +
                                (
                                    newColumn ===
                                    "downvotes"
                                        ? 1
                                        : -1
                                )
                            )

                    })
                    .eq(
                        "id",
                        postId
                    );


                loadPosts();

                return;

            }


            // =========================
            // FIRST VOTE
            // =========================

            const {
                error: insertError
            } =
                await supabaseClient
                    .from("post_votes")
                    .insert({

                        post_id:
                            postId,

                        user_id:
                            user.id,

                        vote_type:
                            voteType

                    });


            if (insertError) {

                console.error(
                    insertError
                );

                return;

            }


            const column =
                voteType === "up"
                    ? "upvotes"
                    : "downvotes";


            const { data: post } =
                await supabaseClient
                    .from("posts")
                    .select(column)
                    .eq(
                        "id",
                        postId
                    )
                    .single();


            await supabaseClient
                .from("posts")
                .update({

                    [column]:
                        (post[column] || 0) + 1

                })
                .eq(
                    "id",
                    postId
                );


            loadPosts();

        }


        // =========================
        // CLICK OUTSIDE
        // =========================

        document.addEventListener(
            "click",
            function(event) {

                const loginBox =
                    document.getElementById(
                        "loginBox"
                    );


                const loginButton =
                    document.getElementById(
                        "loginButton"
                    );


                const pfpBox =
                    document.getElementById(
                        "pfpBox"
                    );


                const changePfpButton =
                    document.getElementById(
                        "changePfpButton"
                    );


                // Close login box

                if (
                    loginBox.style.display ===
                    "block" &&

                    !loginBox.contains(
                        event.target
                    ) &&

                    event.target !==
                    loginButton
                ) {

                    loginBox.style.display =
                        "none";

                }


                // Close PFP box

                if (
                    pfpBox.style.display ===
                    "block" &&

                    !pfpBox.contains(
                        event.target
                    ) &&

                    event.target !==
                    changePfpButton
                ) {

                    pfpBox.style.display =
                        "none";

                }

            }
        );


        // =========================
        // START
        // =========================

        updateUserDisplay();

        loadPosts();

    </script>

</body>

</html>
