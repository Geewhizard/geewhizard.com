<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Blobtown VR Shop</title>

    <link
        rel="icon"
        type="image/png"
        href="favicon.png"
    >

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            color: white;

            font-family: "Comic Sans MS", cursive;

            text-align: center;

            background: black;

        }


        /* =========================
           TITLE
           ========================= */

        h1 {

            margin-top: 30px;

            font-size: 3em;

            color: white;

            text-shadow:
                3px 3px 0 black,
                -2px -2px 0 black,
                2px -2px 0 black,
                -2px 2px 0 black;

        }


        /* =========================
           LOGIN STATUS
           ========================= */

        #userDisplay {

            margin: 10px;

            font-size: 18px;

        }


        /* =========================
           UPLOAD AREA
           ========================= */

        #uploadBox {

            display: none;

            width: 400px;

            max-width: 90%;

            margin: 25px auto;

            padding: 20px;

            background: black;

            border: 2px solid white;

            border-radius: 15px;

        }


        #uploadBox input {

            margin: 10px;

            max-width: 100%;

        }


        #uploadButton {

            padding: 10px 18px;

            background: black;

            color: white;

            border: 2px solid white;

            border-radius: 10px;

            font-family: "Comic Sans MS", cursive;

            cursor: pointer;

        }


        #uploadButton:hover {

            background: #333;

        }


        #uploadMessage {

            margin-top: 10px;

        }


        /* =========================
           SHOP GRID
           ========================= */

        #shopGrid {

            display: grid;

            grid-template-columns:
                repeat(
                    auto-fill,
                    minmax(220px, 1fr)
                );

            gap: 25px;

            width: 90%;

            max-width: 1200px;

            margin: 40px auto;

            padding-bottom: 50px;

        }


        /* =========================
           SHOP ITEM
           ========================= */

        .shop-item {

            position: relative;

            width: 220px;

            height: 220px;

            margin: auto;

            cursor: pointer;

        }


        /* =========================
           SHOP FRAME
           ========================= */

        .shop-frame {

            position: absolute;

            inset: 0;

            width: 100%;

            height: 100%;

            object-fit: contain;

            z-index: 2;

            pointer-events: none;

        }


        /* =========================
           UPLOADED IMAGE
           ========================= */

        .shop-image {

            position: absolute;

            top: 15%;

            left: 15%;

            width: 70%;

            height: 70%;

            object-fit: contain;

            z-index: 1;

            pointer-events: none;

        }


        /* =========================
           HOVER FRAME
           ========================= */

        .shop-hover {

            display: none;

        }


        .shop-item:hover .shop-idle {

            display: none;

        }


        .shop-item:hover .shop-hover {

            display: block;

        }


        /* =========================
           MOBILE
           ========================= */

        @media (max-width: 700px) {

            h1 {

                font-size: 2em;

            }


            #shopGrid {

                grid-template-columns:
                    repeat(
                        2,
                        1fr
                    );

                gap: 15px;

            }


            .shop-item {

                width: 160px;

                height: 160px;

            }

        }

    </style>

</head>


<body>


    <h1>
        Blobtown VR Shop
    </h1>


    <div id="userDisplay">
        Checking login...
    </div>


    <!-- =========================
         UPLOAD BOX
         ========================= -->

    <div id="uploadBox">

        <h2>
            Upload an Item
        </h2>


        <input
            type="file"
            id="shopImageInput"
            accept="image/*"
        >


        <br>


        <button
            id="uploadButton"
            onclick="uploadShopImage()"
        >
            Upload
        </button>


        <p id="uploadMessage"></p>

    </div>


    <!-- =========================
         SHOP
         ========================= -->

    <div id="shopGrid"></div>


    <script>

        /* =========================
           SUPABASE
           ========================= */

        const SUPABASE_URL =
            "https://mgouzykkbpxjtgdvghoc.supabase.co";


        const SUPABASE_KEY =
            "sb_publishable_NE4Ah4WBvguxwcD85QSSGg_BxmdF0MP";


        const supabaseClient =
            supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        let currentUserId = null;


        /* =========================
           CHECK LOGIN
           ========================= */

        async function checkLogin() {

            const {
                data: {
                    user
                }
            } =
                await supabaseClient
                .auth
                .getUser();


            const userDisplay =
                document.getElementById(
                    "userDisplay"
                );


            const uploadBox =
                document.getElementById(
                    "uploadBox"
                );


            if (user) {

                currentUserId =
                    user.id;


                userDisplay.textContent =
                    "Signed in";


                uploadBox.style.display =
                    "block";

            } else {

                currentUserId =
                    null;


                userDisplay.textContent =
                    "You must be signed in to upload.";


                uploadBox.style.display =
                    "none";

            }

        }


        /* =========================
           UPLOAD IMAGE
           ========================= */

        async function uploadShopImage() {

            const input =
                document.getElementById(
                    "shopImageInput"
                );


            const message =
                document.getElementById(
                    "uploadMessage"
                );


            const file =
                input.files[0];


            if (!currentUserId) {

                message.textContent =
                    "You must be signed in.";

                return;

            }


            if (!file) {

                message.textContent =
                    "Choose an image first.";

                return;

            }


            message.textContent =
                "Uploading...";


            const extension =
                file.name
                .split(".")
                .pop();


            const fileName =
                currentUserId
                + "-"
                + Date.now()
                + "-"
                + Math.random()
                    .toString(36)
                    .substring(2)
                + "."
                + extension;


            const filePath =
                fileName;


            const {
                error: uploadError
            } =
                await supabaseClient
                .storage
                .from("shop-images")
                .upload(

                    filePath,

                    file,

                    {
                        contentType:
                            file.type
                    }

                );


            if (uploadError) {

                console.error(
                    uploadError
                );


                message.textContent =
                    uploadError.message;

                return;

            }


            const {
                data: publicUrlData
            } =
                supabaseClient
                .storage
                .from("shop-images")
                .getPublicUrl(
                    filePath
                );


            const imageUrl =
                publicUrlData.publicUrl;


            /* =========================
               SAVE ITEM
               ========================= */

            const {
                error: databaseError
            } =
                await supabaseClient
                .from("shop_items")
                .insert({

                    image_url:
                        imageUrl,

                    user_id:
                        currentUserId

                });


            if (databaseError) {

                console.error(
                    databaseError
                );


                message.textContent =
                    databaseError.message;

                return;

            }


            message.textContent =
                "Uploaded!";


            input.value =
                "";


            await loadShop();

        }


        /* =========================
           LOAD SHOP
           ========================= */

        async function loadShop() {

            const grid =
                document.getElementById(
                    "shopGrid"
                );


            grid.innerHTML =
                "Loading shop...";


            const {
                data: items,
                error
            } =
                await supabaseClient
                .from("shop_items")
                .select("*")
                .order(

                    "created_at",

                    {
                        ascending: false
                    }

                );


            if (error) {

                console.error(
                    error
                );


                grid.innerHTML =
                    "Could not load shop.";


                return;

            }


            grid.innerHTML =
                "";


            if (
                !items ||
                items.length === 0
            ) {

                grid.innerHTML =
                    "No items yet.";

                return;

            }


            items.forEach(
                item => {

                    const shopItem =
                        document.createElement(
                            "div"
                        );


                    shopItem.className =
                        "shop-item";


                    /* =========================
                       UPLOADED IMAGE
                       ========================= */

                    const image =
                        document.createElement(
                            "img"
                        );


                    image.className =
                        "shop-image";


                    image.src =
                        item.image_url;


                    image.alt =
                        "Shop item";


                    /* =========================
                       IDLE FRAME
                       ========================= */

                    const idle =
                        document.createElement(
                            "img"
                        );


                    idle.className =
                        "shop-frame shop-idle";


                    idle.src =
                        "shop-icon-idle.png";


                    idle.alt =
                        "";


                    /* =========================
                       HOVER FRAME
                       ========================= */

                    const hover =
                        document.createElement(
                            "img"
                        );


                    hover.className =
                        "shop-frame shop-hover";


                    hover.src =
                        "shop-icon-hover.png";


                    hover.alt =
                        "";


                    /* =========================
                       CLICK = DOWNLOAD
                       ========================= */

                    shopItem.onclick =
                        function() {

                            downloadImage(
                                item.image_url
                            );

                        };


                    shopItem.appendChild(
                        image
                    );


                    shopItem.appendChild(
                        idle
                    );


                    shopItem.appendChild(
                        hover
                    );


                    grid.appendChild(
                        shopItem
                    );

                }
            );

        }


        /* =========================
           DOWNLOAD IMAGE
           ========================= */

        function downloadImage(
            imageUrl
        ) {

            const link =
                document.createElement(
                    "a"
                );


            link.href =
                imageUrl;


            link.download =
                "blobtown-item";


            link.target =
                "_blank";


            document.body.appendChild(
                link
            );


            link.click();


            document.body.removeChild(
                link
            );

        }


        /* =========================
           AUTH LISTENER
           ========================= */

        supabaseClient
            .auth
            .onAuthStateChange(
                async function() {

                    await checkLogin();

                }
            );


        /* =========================
           START
           ========================= */

        async function start() {

            await checkLogin();

            await loadShop();

        }


        start();

    </script>

</body>

</html>
